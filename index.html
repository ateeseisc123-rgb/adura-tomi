<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISC ENTERPRISE - Data Bundles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. Top Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <div class="brand-logo">
        <span class="logo-icon">📊</span>
        <span class="brand-name">ISC <strong>ENTERPRISE</strong></span>
      </div>
      <a href="#" class="community-btn" id="communityBtn">🔔 Join Community</a>
    </div>
    <div class="nav-right">
      <button class="menu-btn" id="menuBtn">☰</button>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container">

    <!-- 2. Gold Hero Welcome Card -->
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <h1>Mema wo akye, Welcome! 👋</h1>
          <p class="subtitle">Welcome to ISC ENTERPRISE</p>
          <span class="badge-dark">Fast & Reliable Data</span>
        </div>
        <div class="profile-icons">
          <span class="circle-icon">👤</span>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn-dark" id="ordersBtn">🕒 Orders</button>
        <button class="btn-dark" id="transactionsBtn">📄 Transactions</button>
      </div>

      <div class="hero-footer">
        <div class="perks">
          <span>⚡ Instant</span>
          <span>🛡️ Secure</span>
          <span>🕒 24/7</span>
        </div>
        <a href="#" class="help-pill" id="helpBtn">🎧 Need Help ›</a>
      </div>
    </section>

    <!-- 3. Place New Order (MTN & Telecel Only) -->
    <section class="white-card">
      <h2>Place New Order</h2>
      <div class="network-grid">
        
        <div class="network-box mtn-box" onclick="openOrderModal('MTN')">
          <div class="network-circle mtn-circle">MTN</div>
          <p>MTN</p>
        </div>

        <div class="network-box telecel-box" onclick="openOrderModal('Telecel')">
          <div class="network-circle telecel-circle">t</div>
          <p>Telecel</p>
        </div>

      </div>
    </section>

    <!-- 4. Recent Orders -->
    <section class="white-card" id="orders-section">
      <div class="card-header">
        <h2>Recent Orders</h2>
        <a href="#orders-section" class="view-all">View All ›</a>
      </div>
      <div id="ordersList">
        <p class="empty-text">No recent orders yet. Select MTN or Telecel above to buy data.</p>
      </div>
    </section>

  </main>

  <!-- Popup Order Form Modal -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">Buy Data Bundle</h3>
        <button class="close-btn" id="closeModalBtn">✕</button>
      </div>
      
      <form id="bundleForm">
        <div class="form-group">
          <label for="bundleSelect">Choose Package:</label>
          <select id="bundleSelect" required></select>
        </div>

        <div class="form-group">
          <label for="recipientPhone">Recipient Phone Number:</label>
          <input type="tel" id="recipientPhone" placeholder="e.g. 0241234567" maxlength="10" required />
        </div>

        <button type="submit" class="submit-btn">Place Order</button>
      </form>
    </div>
  </div>

  <!-- Floating Chat Button -->
  <button class="floating-chat" id="chatBtn" title="Support">💬</button>

  <script src="script.js"></script>
</body>
</html>
