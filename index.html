<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISC ENTERPRISE - Data Bundles</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. Top Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <div class="brand-logo">
        <span class="logo-icon">📊</span>
        <span class="brand-name">ISC <strong>ENTERPRISE</strong></span>
      </div>
      <a href="#" class="community-btn">🔔 Join Community</a>
    </div>
    <div class="nav-right">
      <button class="menu-btn">☰</button>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container">

    <!-- 2. Gold Hero Welcome Card -->
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <h1>Mema wo akye, Welcome! 👋</h1>
          <p class="subtitle">Welcome to ISC ENTERPRISE</p>
          <span class="badge-dark">Fast & Reliable Data</span>
        </div>
        <div class="profile-icons">
          <span class="circle-icon">👤</span>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn-dark">🕒 Orders</button>
        <button class="btn-dark">📄 Transactions</button>
      </div>

      <div class="hero-footer">
        <div class="perks">
          <span>⚡ Instant</span>
          <span>🛡️ Secure</span>
          <span>🕒 24/7</span>
        </div>
        <a href="#" class="help-pill">🎧 Need Help ›</a>
      </div>
    </section>

    <!-- 3. Place New Order (MTN & Telecel Only) -->
    <section class="white-card">
      <h2>Place New Order</h2>
      <div class="network-grid">


        <div class="network-box mtn-box" onclick="selectNetwork('MTN')">
          <div class="network-circle mtn-circle">MTN</div>
          <p>MTN</p>
        </div>

        <div class="network-box telecel-box" onclick="selectNetwork('Telecel')">
          <div class="network-circle telecel-circle">t</div>
          <p>Telecel</p>
        </div>

      </div>
    </section>

    <!-- 4. Recent Orders -->
    <section class="white-card">
      <div class="card-header">
        <h2>Recent Orders</h2>
        <a href="#" class="view-all">View All ›</a>
      </div>
      <p class="empty-text">No recent orders yet. Select MTN or Telecel above to buy data.</p>
    </section>

  </main>

  <!-- Floating Chat Button -->
  <button class="floating-chat" title="Support">💬</button>

  <script src="script.js"></script>
</body>
  </html>
